<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎀 My Melody 甜點換裝派對</title>
  <!-- 💡 拼音庫 + 🎉 煙花粒子動畫庫 -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    
    /* 🌸 夢幻柔和背景 */
    body {
      background: radial-gradient(circle at center, #ffe4e1 0%, #ffb6c1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
      color: #831843;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    /* 🎀 泡泡玻璃卡片容器 */
    .card-container {
      background: rgba(255, 255, 255, 0.88);
      border: 4px solid #ff69b4;
      backdrop-filter: blur(15px);
      width: 95%;
      max-width: 580px;
      padding: 35px 22px 26px 22px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.25), inset 0 0 20px rgba(255, 192, 203, 0.4);
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    /* 🐰 頂部蝴蝶結裝飾 */
    .card-container::before {
      content: '🎀';
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 55px;
      filter: drop-shadow(0 4px 6px rgba(255, 105, 180, 0.4));
      z-index: 10;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }
    .count-badge {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #c2185b;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      border: 1px solid #ff69b4;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
    }
    .combo-badge {
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #fff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(253, 160, 133, 0.4);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
    .high-score-badge {
      background: #fff3e0;
      color: #e65100;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #ffcc80;
    }
    .stage-badge {
      background: #fff0f5;
      color: #d81b60;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 10px;
      display: inline-block;
      border: 2px dashed #f48fb1;
    }
    
    .header-ctrls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    .mode-btn {
      background: #fce4ec;
      color: #d81b60;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #f06292;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #f06292;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(240, 98, 146, 0.4);
    }
    .bgm-btn {
      background: #fff8e1;
      color: #f57f17;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ffd54f;
      transition: all 0.2s ease;
    }
    .bgm-btn.active {
      background: #ffca28;
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 202, 40, 0.4);
    }

    /* 🍰 甜點與換裝進度條 */
    .pet-stage {
      background: #fff;
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #ffb6c1;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
    }
    .pet-name {
      font-size: 16px;
      font-weight: bold;
      color: #d81b60;
      margin-bottom: 8px;
    }
    .pet-exp-bar {
      background: #ffe4e1;
      border-radius: 12px;
      height: 18px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #ffb6c1;
      position: relative;
    }
    .pet-exp-fill {
      background: linear-gradient(90deg, #ff9a9e, #fecfef);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 🐰 卡片與文字 */
    .flashcard {
      background: #fff0f5;
      border: 4px solid #ffb6c1;
      border-radius: 35px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 0 18px 0;
      position: relative;
      transition: all 0.2s ease;
      box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
    }
    .flashcard.correct {
      border-color: #69f0ae;
      background: #e8f5e9;
      box-shadow: 0 0 35px rgba(105, 240, 174, 0.6);
    }
    .flashcard.correct .pet-avatar {
      animation: petJump 0.35s ease-in-out;
    }
    .flashcard.critical {
      border-color: #ff4081;
      background: #fce4ec;
      box-shadow: 0 0 45px rgba(255, 64, 129, 0.6);
    }
    .flashcard.critical .pet-avatar {
      animation: petJumpCrit 0.45s ease-in-out;
    }
    .flashcard.wrong {
      border-color: #e53935;
      background: #ffebee;
    }

    @keyframes petJump {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.15); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes petJumpCrit {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      30% { transform: translateY(-25px) scale(1.25) rotate(-10deg); }
      70% { transform: translateY(-25px) scale(1.25) rotate(10deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    .pet-avatar { font-size: 56px; line-height: 1; margin-bottom: 4px; transition: all 0.3s ease; }
    .pet-avatar.ultimate-avatar { font-size: 75px; filter: drop-shadow(0 0 12px #ff4081); }

    .word {
      font-size: 60px;
      font-weight: bold;
      color: #880e4f;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #fff, 0 0 15px rgba(255, 255, 255, 0.8);
      transition: font-size 0.3s ease;
    }

    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #c2185b;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .crit-popup {
      position: absolute;
      top: -20px;
      font-size: 26px;
      font-weight: 900;
      color: #ff4081;
      text-shadow: 2px 2px 0px #fff, 0 0 15px #ffb6c1;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      50% { opacity: 1; transform: translateY(-20px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-35px) scale(1); }
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(255, 117, 140, 0.4); }
    .btn-success { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4); }
    .btn-warning { background: linear-gradient(135deg, #f6d365, #fda085); box-shadow: 0 6px 20px rgba(253, 160, 133, 0.4); }
    .btn-danger { background: linear-gradient(135deg, #ff0844, #ffb199); box-shadow: 0 6px 20px rgba(255, 8, 68, 0.4); }
    .btn-secondary { background: #f1f2f6; color: #747d8c; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 15px; padding: 10px 20px; }

    /* iPad 橫屏自適應 */
    @media (orientation: landscape) and (min-width: 768px) {
      body { padding: 10px; }
      .card-container { max-width: 820px; padding: 40px 40px; }
      .flashcard { height: 230px; }
      .word { font-size: 78px; }
      .pet-avatar { font-size: 66px; }
      .pet-avatar.ultimate-avatar { font-size: 85px; }
      .pet-name { font-size: 20px; }
      .status-text { font-size: 20px; }
      .btn { font-size: 22px; padding: 16px 40px; }
    }

    /* 💖 彈窗樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 182, 193, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #ffffff;
      border: 4px solid #ff69b4;
      border-radius: 35px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
      color: #880e4f;
    }

    .learn-card {
      background: #fff0f5;
      border: 3px dashed #ffb6c1;
      border-radius: 20px;
      padding: 18px;
      margin: 18px 0;
    }
    .learn-word { font-size: 36px; font-weight: bold; color: #d81b60; }
    .learn-pinyin { font-size: 26px; font-weight: bold; color: #ff4081; margin-top: 6px; }

    .wrong-words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 10px;
      background: #fffafa;
      border-radius: 14px;
      border: 1px solid #ffe4e1;
    }
    .wrong-tag {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 15px;
      color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="card-container" id="main-card">
    <div class="badges-row">
      <div class="count-badge" id="count-display">🍰 餵食甜點：0 份</div>
      <div class="combo-badge" id="combo-display">💖 連擊：0</div>
      <div class="high-score-badge" id="high-score-display">🏆 最高：0</div>
    </div>

    <div class="stage-badge" id="stage-display">🗺️ 場景：🌸 馬卡龍櫻花森林</div>

    <div class="header-ctrls">
      <div class="mode-btn active" id="btn-mode-seq" onclick="selectMode('sequential')">➡️ 順序派對</div>
      <div class="mode-btn" id="btn-mode-rand" onclick="selectMode('random')">🔀 驚喜盲盒</div>
      <div class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">🔇 BGM: OFF</div>
    </div>

    <div class="pet-stage">
      <div class="pet-name" id="pet-name">即將解鎖新配件... (0/10)</div>
      <div class="pet-exp-bar">
        <div class="pet-exp-fill" id="exp-fill"></div>
      </div>
    </div>

    <div class="flashcard" id="flashcard">
      <div id="crit-box"></div>
      <div class="pet-avatar" id="pet-avatar">🐰</div>
      <div class="word" id="word-display">點擊下方開始</div>
    </div>

    <div class="status-text" id="status-text">點擊按鈕給 Melody 餵甜點吧！</div>

    <div class="btn-group">
      <button class="btn" id="start-btn" onclick="handleClickStart()">🍰 開始餵食甜點</button>
      <button class="btn btn-warning" id="resume-btn" onclick="loadSavedProgress()" style="display:none;">📂 繼續上次進度</button>
    </div>
    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">跳過此詞</button>

    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#d81b60; margin-bottom:10px;">🎯 派對總結</div>
      <div id="result-info" style="font-size:17px; color:#5c0011; line-height:1.6;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #d81b60; margin-bottom: 10px;">🥺 Melody 沒聽清楚呢</div>
      <div style="font-size: 15px; color: #880e4f; margin-bottom: 10px;">「請再教教我這個詞語怎麼讀吧！」</div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #880e4f;">正確的發音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #ad1457; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">✨ 再教一次 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重新開始 (從頭開始)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 休息一下 (查看成果)</button>
      </div>
    </div>
  </div>

  <script>
    // 💡 多音字特例精準校正字典（解決樂器、聽音樂、快樂的讀音問題）
    const customPinyinDict = {
      "聽音樂": "tīng yīn yuè", "聽音乐": "tīng yīn yuè",
      "音樂": "y
