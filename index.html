<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    
    /* 🌸 美樂蒂粉嫩夢幻背景 */
    body {
      background: radial-gradient(circle at center, #ffe4e1 0%, #ffb6c1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
      color: #831843;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    /* 🎀 泡泡玻璃卡片容器 */
    .card-container {
      background: rgba(255, 255, 255, 0.85);
      border: 4px solid #ff69b4;
      backdrop-filter: blur(20px);
      width: 95%;
      max-width: 580px;
      padding: 30px 22px 26px 22px;
      border-radius: 40px;
      box-shadow: 0 10px 35px rgba(255, 105, 180, 0.3), inset 0 0 20px rgba(255, 192, 203, 0.5);
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    /* 🐰 頂部蝴蝶結裝飾 */
    .card-container::before {
      content: '🎀';
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 50px;
      filter: drop-shadow(0 4px 6px rgba(255, 105, 180, 0.4));
      z-index: 10;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      margin-top: 10px;
    }
    .count-badge {
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      color: #c2185b;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      border: 1px solid #ff69b4;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
    }
    .combo-badge {
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #fff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(253, 160, 133, 0.4);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }
    .high-score-badge {
      background: #fff3e0;
      color: #e65100;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      border: 1px solid #ffcc80;
    }
    .stage-badge {
      background: #fff0f5;
      color: #d81b60;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 8px;
      display: inline-block;
      border: 2px dashed #f48fb1;
    }
    
    .header-ctrls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    .mode-btn {
      background: #fce4ec;
      color: #d81b60;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #f06292;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #f06292;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(240, 98, 146, 0.4);
    }
    .bgm-btn {
      background: #fff8e1;
      color: #f57f17;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ffd54f;
      transition: all 0.2s ease;
    }
    .bgm-btn.active {
      background: #ffca28;
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 202, 40, 0.4);
    }

    /* 🍰 甜點進度條 */
    .pet-stage {
      background: #fff;
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 12px;
      border: 2px solid #ffb6c1;
      box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
    }
    .pet-name {
      font-size: 17px;
      font-weight: bold;
      color: #d81b60;
      margin-bottom: 8px;
    }
    .pet-exp-bar {
      background: #ffe4e1;
      border-radius: 12px;
      height: 18px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #ffb6c1;
      position: relative;
    }
    .pet-exp-fill {
      background: linear-gradient(90deg, #ff9a9e, #fecfef);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 🐰 卡片與文字 */
    .flashcard {
      background: #fff0f5;
      border: 4px solid #ffb6c1;
      border-radius: 35px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 0 18px 0;
      position: relative;
      transition: all 0.2s ease;
      box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
    }
    .flashcard.correct {
      border-color: #69f0ae;
      background: #e8f5e9;
      box-shadow: 0 0 35px rgba(105, 240, 174, 0.6);
    }
    .flashcard.correct .pet-avatar {
      animation: petJump 0.35s ease-in-out;
    }
    .flashcard.critical {
      border-color: #ff4081;
      background: #fce4ec;
      box-shadow: 0 0 45px rgba(255, 64, 129, 0.6);
    }
    .flashcard.critical .pet-avatar {
      animation: petJumpCrit 0.45s ease-in-out;
    }
    .flashcard.wrong {
      border-color: #e53935;
      background: #ffebee;
    }

    @keyframes petJump {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.15); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes petJumpCrit {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      30% { transform: translateY(-25px) scale(1.25) rotate(-10deg); }
      70% { transform: translateY(-25px) scale(1.25) rotate(10deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    .pet-avatar { font-size: 56px; line-height: 1; margin-bottom: 4px; transition: all 0.3s ease; }
    .pet-avatar.ultimate-avatar { font-size: 75px; filter: drop-shadow(0 0 12px #ff4081); }

    .word {
      font-size: 60px;
      font-weight: bold;
      color: #880e4f;
      letter-spacing: 3px;
      text-shadow: 2px 2px 0px #fff, 0 0 15px rgba(255, 255, 255, 0.8);
      transition: font-size 0.3s ease;
    }

    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #c2185b;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .crit-popup {
      position: absolute;
      top: -20px;
      font-size: 26px;
      font-weight: 900;
      color: #ff4081;
      text-shadow: 2px 2px 0px #fff, 0 0 15px #ffb6c1;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      50% { opacity: 1; transform: translateY(-20px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-35px) scale(1); }
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(255, 117, 140, 0.4); }
    .btn-success { background: linear-gradient(135deg, #4facfe, #00f2fe); box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4); }
    .btn-warning { background: linear-gradient(135deg, #f6d365, #fda085); box-shadow: 0 6px 20px rgba(253, 160, 133, 0.4); }
    .btn-danger { background: linear-gradient(135deg, #ff0844, #ffb199); box-shadow: 0 6px 20px rgba(255, 8, 68, 0.4); }
    .btn-secondary { background: #f1f2f6; color: #747d8c; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 15px; padding: 10px 20px; }

    /* iPad 橫屏自適應 */
    @media (orientation: landscape) and (min-width: 768px) {
      body { padding: 10px; }
      .card-container { max-width: 820px; padding: 35px 40px; }
      .flashcard { height: 230px; }
      .word { font-size: 78px; }
      .pet-avatar { font-size: 66px; }
      .pet-avatar.ultimate-avatar { font-size: 85px; }
      .pet-name { font-size: 20px; }
      .status-text { font-size: 20px; }
      .btn { font-size: 22px; padding: 16px 40px; }
    }

    /* 💖 彈窗樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 182, 193, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #ffffff;
      border: 4px solid #ff69b4;
      border-radius: 35px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
      color: #880e4f;
    }

    .learn-card {
      background: #fff0f5;
      border: 3px dashed #ffb6c1;
      border-radius: 20px;
      padding: 18px;
      margin: 18px 0;
    }
    .learn-word { font-size: 36px; font-weight: bold; color: #d81b60; }
    .learn-pinyin { font-size: 26px; font-weight: bold; color: #ff4081; margin-top: 6px; }

    .wrong-words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 10px;
      background: #fffafa;
      border-radius: 14px;
      border: 1px solid #ffe4e1;
    }
    .wrong-tag {
      background: #ffebee;
      border: 1px solid #ffcdd2;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 15px;
      color: #d32f2f;
    }

<body>

  <div class="card-container" id="main-card">
    <div class="badges-row">
      <div class="count-badge" id="count-display">🍰 餵食甜點：0 份</div>
      <div class="combo-badge" id="combo-display">💖 連擊：0</div>
      <div class="high-score-badge" id="high-score-display">🏆 最高：0</div>
    </div>

    <div class="stage-badge" id="stage-display">🐰 目前換裝：🌸 基礎粉紅小兔</div>

    <div class="header-ctrls">
      <div class="mode-btn active" id="btn-mode-seq" onclick="selectMode('sequential')">➡️ 順序餵食</div>
      <div class="mode-btn" id="btn-mode-rand" onclick="selectMode('random')">🔀 驚喜盲盒</div>
      <div class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">🔇 BGM: OFF</div>
    </div>

    <!-- 🍰 甜點進度條 -->
    <div class="pet-stage">
      <div class="pet-name" id="pet-name">即將獲得下一個配件... (0/10)</div>
      <div class="pet-exp-bar">
        <div class="pet-exp-fill" id="exp-fill"></div>
      </div>
    </div>

    <div class="flashcard" id="flashcard">
      <div id="crit-box"></div>
      <div class="pet-avatar" id="pet-avatar">🐰</div>
      <div class="word" id="word-display">點擊下方開始</div>
    </div>

    <div class="status-text" id="status-text">點擊按鈕，念出詞語給 Melody 餵甜點吧！</div>

    <div class="btn-group">
      <button class="btn" id="start-btn" onclick="handleClickStart()">🍰 開始餵食甜點</button>
      <button class="btn btn-warning" id="resume-btn" onclick="loadSavedProgress()" style="display:none;">📂 繼續上次進度</button>
    </div>
    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">跳過此詞</button>

    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#d81b60; margin-bottom:10px;">🎯 甜點派對日誌</div>
      <div id="result-info" style="font-size:17px; color:#5c0011; line-height:1.6;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #d81b60; margin-bottom: 10px;">🥺 Melody 沒聽清楚呢</div>
      <div style="font-size: 15px; color: #880e4f; margin-bottom: 10px;">「請再教教我這個詞語怎麼讀吧！」<br><span style="font-size:12px; color:#aaa;">(安卓手機若無反應，請稍等2秒或重按開始)</span></div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #880e4f;">正確的發音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #ad1457; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">✨ 再教一次 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重新開始 (從頭開始)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 休息一下 (查看成果)</button>
      </div>
    </div>
  </div>

    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-seq').className = mode === 'sequential' ? "mode-btn active" : "mode-btn";
      document.getElementById('btn-mode-rand').className = mode === 'random' ? "mode-btn active" : "mode-btn";

    function toggleBGM() {
      isBgmOn = !isBgmOn;
      const btn = document.getElementById('bgm-btn');
      if (isBgmOn) {
        btn.innerText = "🎵 BGM: ON";
        btn.classList.add('active');
        startBGMLoop();
      } else {
        btn.innerText = "🔇 BGM: OFF";
        btn.classList.remove('active');
        stopBGMLoop();
      }
    }

    function startBGMLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
      const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25]; // 輕快八音盒
      let step = 0;
      bgmInterval = setInterval(() => {
        if (!isBgmOn) return;
        try {
          const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
          gain.gain.setValueAtTime(0.03, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
          step++;
        } catch(e){}
      }, 400);
    }

    function stopBGMLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 🎀 獲取換裝與甜點狀態 (每 10 詞一裝扮，每 30 詞一地圖)
    function getMelodyState(index) {
      const accIdx = Math.floor(index / 10) % accessories.length;
      const currentAcc = accessories[accIdx];
      const dessertIdx = index % 10; // 0~9
      const stepInLevel = dessertIdx + 1; // 1~10
      const isOutfitUnlock = (stepInLevel === 10);
      const nextAcc = accessories[(accIdx + 1) % accessories.length];
      const themeIdx = Math.floor(index / 30) % stageThemes.length;

      return {
        currentAcc: currentAcc,
        nextAcc: nextAcc,
        dessert: desserts[dessertIdx],
        isOutfitUnlock: isOutfitUnlock,
        stepInLevel: stepInLevel,
        themeIdx: themeIdx
      };
    }

    function playSuccessChime(isUnlock, isCrit) {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const notes = isUnlock ? [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98] : (isCrit ? [523.25, 659.25, 783.99, 1046.50, 1318.51] : [523.25, 659.25, 783.99, 1046.50]);
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = (isUnlock || isCrit) ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.05);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.05);
          osc.stop(ctx.currentTime + i * 0.05 + 0.3);
        });
      } catch(e) {}
    }

    function playFailBuzz() {
      try {
        const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.4);
      } catch(e) {}
    }

    function triggerConfetti(isUnlock, isCrit) {
      if (window.confetti) {
        confetti({
          particleCount: isUnlock ? 150 : (isCrit ? 80 : 35),
          spread: isUnlock ? 120 : (isCrit ? 90 : 50),
          colors: ['#ffb6c1', '#ff69b4', '#ff1493', '#fff', '#fef08a'],
          origin: { y: 0.65 }
        });
      }
    }

    function loadHighScore() {
      const savedScore = localStorage.getItem('vocab_challenge_max') || 0;
      document.getElementById('high-score-display').innerText = `🏆 最高：${savedScore}`;
      checkSavedProgressBtn();
      return parseInt(savedScore);
    }

    function checkSavedProgressBtn() {
      const savedIdx = parseInt(localStorage.getItem('vocab_saved_index') || '0');
      const resumeBtn = document.getElementById('resume-btn');
      if (savedIdx > 0 && savedIdx < rawWordList.length && !isChallenging) {
        resumeBtn.innerText = `📂 繼續第 ${savedIdx + 1} 詞`;
        resumeBtn.style.display = 'inline-block';
      } else {
        resumeBtn.style.display = 'none';
      }
    }

    function saveProgress() {
      localStorage.setItem('vocab_saved_index', currentIndex);
      localStorage.setItem('vocab_saved_mode', currentMode);
      localStorage.setItem('vocab_saved_list', JSON.stringify(activeWordList));
    }

    // ⚡ 優先更新畫面字詞
    function updateCard() {
      if (currentIndex >= activeWordList.length) {
        endChallenge(true);
        return;
      }

      const mState = getMelodyState(currentIndex);

      // 切換主題地圖 (每 30 詞)
      const theme = stageThemes[mState.themeIdx];
      document.body.style.background = theme.bg;
      document.getElementById('stage-display').innerText = `🗺️ 場景：${theme.name}`;

      // 更新進度條
      document.getElementById('pet-name').innerText = `即將換上【${mState.nextAcc.name}】 (${mState.stepInLevel}/10)`;
      document.getElementById('exp-fill').style.width = `${(mState.stepInLevel / 10) * 100}%`;

      // 更新卡片頭像 (美樂蒂 + 當前配件)
      const avatarElem = document.getElementById('pet-avatar');
      avatarElem.innerText = `🐰${mState.currentAcc.icon}`;
      
      const flashcard = document.getElementById('flashcard');
      if (mState.isOutfitUnlock) {
        avatarElem.className = "pet-avatar ultimate-avatar";
        flashcard.className = "flashcard critical";
      } else {
        avatarElem.className = "pet-avatar";
        flashcard.className = "flashcard";
      }

      document.getElementById('count-display').innerText = `🍰 餵食甜點：${currentIndex} 份`;
      document.getElementById('combo-display').innerText = `💖 連擊：${comboCount}`;
      
      // 💡 立即替換字詞
      document.getElementById('word-display').innerText = activeWordList[currentIndex];
      saveProgress();
    }

    function startNewGame() {
      if (currentMode === 'random') {
        activeWordList = shuffleArray(rawWordList);
      } else {
        activeWordList = [...rawWordList];
      }
      currentIndex = 0;
      comboCount = 0;
      maxCombo = 0;
      sessionWrongWords.clear();

      updateCard(); // 優先刷新字詞
      startChallengeProcess();
    }

    function loadSavedProgress() {
      currentIndex = parseInt(localStorage.getItem('vocab_saved_index') || '0');
      currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
      selectMode(currentMode);

      const savedList = localStorage.getItem('vocab_saved_list');
      if (savedList) {
        try {
          const parsed = JSON.parse(savedList);
          if (Array.isArray(parsed) && parsed.length > 0) {
            activeWordList = parsed;
          } else {
            activeWordList = [...rawWordList];
          }
        } catch(e) { activeWordList = [...rawWordList]; }
      }

      updateCard(); 
      startChallengeProcess();
    }

    function handleClickStart() {
      if (isChallenging) {
        stopChallenge();
      } else {
        startNewGame();
      }
    }

    function startChallengeProcess() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("您的瀏覽器不支援原生語音辨識，請使用 Safari 或是支援 Web Speech 的瀏覽器！");
        return;
      }

      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      if (isBgmOn) startBGMLoop();

      isChallenging = true;
      isAndroidRetrying = false;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('start-btn').innerText = '⏸️ 暫停休息';
      document.getElementById('start-btn').className = 'btn btn-danger';
      document.getElementById('resume-btn').style.display = 'none';
      document.getElementById('skip-btn').style.display = 'inline-block';
      
      initSpeechRecognition();
    }

    function stopChallenge() {
      isChallenging = false;
      isAndroidRetrying = false;
      stopBGMLoop();
      if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('start-btn').innerText = '🍰 開始餵食甜點';
      document.getElementById('start-btn').className = 'btn';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = 'Melody 正在安靜休息中...';
      checkSavedProgressBtn();
    }

    // ⚡ 實時串流與安卓防斷流保護
    function initSpeechRecognition() {
      if (!isChallenging) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;
      recognition.interimResults = true; // 實時攔截

      const targetWord = activeWordList[currentIndex].replace(/[…\.]/g, '');
      const mState = getMelodyState(currentIndex);
      
      if (mState.isOutfitUnlock) {
        document.getElementById('status-text').innerText = `✨ 解鎖換裝！請念出【${targetWord}】！`;
      } else {
        document.getElementById('status-text').innerText = `🎤 請念出【${targetWord}】餵食 ${mState.dessert}！`;
      }

      recognition.onresult = (event) => {
        if (!isChallenging) return;
        isAndroidRetrying = false; // 收到訊號解除重試標記

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const heardText = event.results[i][0].transcript.trim();
          console.log(`聽到的語音：[${heardText}]`);

          if (checkMatch(heardText, targetWord)) {
            handleSuccess();
            return;
          }
        }
      };

      recognition.onerror = (event) => {
        console.warn("語音辨識錯誤:", event.error);
        if (isChallenging && !isAndroidRetrying) {
          isAndroidRetrying = true;
          // 針對安卓手機/榮耀無反應的防卡死重啟機制
          setTimeout(() => { if(isChallenging) restartListening(); }, 300);
        }
      };

      recognition.onend = () => {
        if (isChallenging && !isAndroidRetrying) {
          restartListening();
        }
      };

      try {
        recognition.start();
      } catch(e) {
        setTimeout(() => { if(isChallenging) restartListening(); }, 500);
      }
    }

    function restartListening() {
      if (!isChallenging) return;
      isAndroidRetrying = false;
      try {
        recognition.start();
      } catch(e) {}
    }

    function getStandardPinyin(word) {
      if (customPinyinDict[word]) return customPinyinDict[word];
      if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
        try {
          return pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        } catch(e) {}
      }
      return '';
    }

    function getPinyinSyllableArray(word) {
      const cleanWord = word.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');
      if (customPinyinArrayDict[cleanWord]) {
        return customPinyinArrayDict[cleanWord];
      }
      if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
        try {
          return pinyinPro.pinyin(cleanWord || word, { toneType: 'none', type: 'array' });
        } catch(e) {}
      }
      return [];
    }

    function normalizeSyllable(s) {
      if (!s) return '';
      let py = s.toLowerCase().replace(/[^a-z]/g, '');
      if (py === 'lu') py = 'lv';
      if (py === 'nu') py = 'nv';

      if (py.startsWith('n')) py = 'l' + py.slice(1);
      if (py.startsWith('zh')) py = 'z' + py.slice(2);
      else if (py.startsWith('ch')) py = 'c' + py.slice(2);
      else if (py.startsWith('sh')) py = 's' + py.slice(2);

      if (py.endsWith('ing')) py = py.slice(0, -3) + 'in';
      else if (py.endsWith('eng')) py = py.slice(0, -3) + 'en';
      else if (py.endsWith('ang')) py = py.slice(0, -3) + 'an';

      return py;
    }

    // 💡 逐字音節嚴格匹配引擎（繁簡100%相通，避免相似音誤判）
    function checkMatch(heard, target) {
      if (!heard || !target) return false;
      
      const cleanHeard = heard.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');
      const cleanTarget = target.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');

      if (!cleanHeard) return false;

      const targetSyllables = getPinyinSyllableArray(cleanTarget);
      const heardSyllables = getPinyinSyllableArray(cleanHeard);

      if (!targetSyllables.length || !heardSyllables.length) return false;

      const normTarget = targetSyllables.map(normalizeSyllable);
      const normHeard = heardSyllables.map(normalizeSyllable);

      const tLen = normTarget.length;
      const hLen = normHeard.length;

      if (hLen < tLen) return false;

      for (let i = 0; i <= hLen - tLen; i++) {
        let isMatch = true;
        for (let j = 0; j < tLen; j++) {
          if (normHeard[i + j] !== normTarget[j]) {
            isMatch = false;
            break;
          }
        }
        if (isMatch) return true;
      }

      return false;
    }

    function handleSuccess() {
      comboCount++;
      if (comboCount > maxCombo) maxCombo = comboCount;

      const mState = getMelodyState(currentIndex);
      const isUnlock = mState.isOutfitUnlock;
      const isCrit = comboCount >= 3;

      playSuccessChime(isUnlock, isCrit);
      triggerConfetti(isUnlock, isCrit);

      document.getElementById('flashcard').className = isUnlock ? 'flashcard critical correct' : 'flashcard correct';

      if (isUnlock) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">✨ 獲得新配件！</div>`;
        document.getElementById('status-text').innerText = `✨ 太棒了！Melody 換上了【${mState.nextAcc.name}】！`;
      } else if (isCrit) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">💖 COMBO x${comboCount}</div>`;
        document.getElementById('status-text').innerText = `💖 觸發連擊！Melody 開心地吃下了 ${mState.dessert}！`;
      } else {
        document.getElementById('status-text').innerText = `🍰 餵食成功！Melody 吃下了 ${mState.dessert}！`;
      }

      currentIndex++;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      setTimeout(() => {
        if (isChallenging) {
          document.getElementById('crit-box').innerHTML = '';
          updateCard();
          initSpeechRecognition();
        }
      }, isUnlock ? 600 : 200);
    }

    function handleFailPrompt(targetWord, heardText) {
      playFailBuzz();
      comboCount = 0;
      document.getElementById('flashcard').className = 'flashcard wrong';
      
      sessionWrongWords.add(targetWord);

      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('modal-word').innerText = targetWord;
      document.getElementById('modal-pinyin').innerText = `[ ${getStandardPinyin(targetWord)} ]`;
      document.getElementById('modal-heard').innerText = heardText ? `(剛才聽到的發音是："${heardText}")` : '(未接收到清晰語音)';
      document.getElementById('fail-modal').style.display = 'flex';
    }

    function choiceContinue() {
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('flashcard').className = 'flashcard';
      initSpeechRecognition();
    }

    function choiceRestart() {
      document.getElementById('fail-modal').style.display = 'none';
      startNewGame();
    }

    function choiceEnd() {
      document.getElementById('fail-modal').style.display = 'none';
      showFinalSummary();
    }

    function skipWord() {
      if (!isChallenging) return;
      comboCount = 0;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      currentIndex++;
      updateCard();
      initSpeechRecognition();
    }

    function showFinalSummary() {
      stopChallenge();

      const count = currentIndex;
      const currentMax = loadHighScore();
      let isNewRecord = false;

      if (count > currentMax) {
        localStorage.setItem('vocab_challenge_max', count);
        loadHighScore();
        isNewRecord = true;
      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = isNewRecord ? "🎉 恭喜刷新最高餵食紀錄！" : "🎯 甜點派對日誌";
      
      let wrongWordsHTML = "";
      if (sessionWrongWords.size > 0) {
        wrongWordsHTML = `
          <div style="margin-top: 15px; text-align: left;">
            <div style="font-weight: bold; color: #d81b60; font-size: 16px;">❌ 本次待教導複習的詞語（錯題集）：</div>
            <div class="wrong-words-grid">
              ${Array.from(sessionWrongWords).map(w => `<div class="wrong-tag"><b>${w}</b> <span style="font-size:13px; color:#ad1457;">(${getStandardPinyin(w)})</span></div>`).join('')}
            </div>
          </div>
        `;
      } else {
        wrongWordsHTML = `<div style="margin-top: 10px; color: #10b981; font-weight: bold;">🌟 太棒了！本次派對全程完美零失誤！</div>`;
      }

      resultInfo.innerHTML = `
        🍰 本次共成功餵食了 <b>${count}</b> 份甜點！<br>
        🎀 成功為 Melody 收集了 <b>${Math.floor(count/10)}</b> 個配件！<br>
        💖 最高愛心連擊：<b>${maxCombo} Combo</b>！<br>
        ${isNewRecord ? "🌟 成功創下新的個人最高餵食紀錄！" : "繼續加油，收集更多漂亮的配件！"}
        ${wrongWordsHTML}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      const count = currentIndex;
      localStorage.setItem('vocab_challenge_max', activeWordList.length);
      loadHighScore();

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = "🎉 恭喜收集完全部服裝！";
      resultInfo.innerHTML = `📚 太震撼了！你成功收集並解鎖了 Melody 所有的換裝配件！`;
      resultBox.style.display = 'block';
    }

    loadHighScore();
    
    const savedListStr = localStorage.getItem('vocab_saved_list');
    if (savedListStr) {
      try {
        const parsed = JSON.parse(savedListStr);
        if (Array.isArray(parsed) && parsed.length > 0) {
          activeWordList = parsed;
        } else {
          activeWordList = [...rawWordList];
        }
      } catch(e) { activeWordList = [...rawWordList]; }
    }
    currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
    selectMode(currentMode);
  </script>
</body>
